<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Visible strings carry data-i18n* attributes and are filled in by applyStaticText()
     in app.js; see the I18N table there. -->
<div id="tabbar">
  <div id="tabs"></div>
  <button id="new-tab" class="icon-btn" data-i18n-title="toolbar.newTab">+</button>
  <div class="spacer"></div>
  <button id="btn-open" class="tool-btn" data-i18n="toolbar.open" data-i18n-title="toolbar.openTitle"></button>
  <div id="save-wrap">
    <button id="btn-save" class="tool-btn" data-i18n="toolbar.save" data-i18n-title="toolbar.saveTitle"></button>
    <button id="btn-save-more" class="tool-btn caret" data-i18n-title="toolbar.saveMore">▾</button>
    <div id="save-menu" hidden>
      <button class="menu-item" data-act="html" type="button" data-i18n="menu.saveHtml"></button>
      <button class="menu-item" data-act="pdf" type="button" data-i18n="menu.savePdf"></button>
    </div>
  </div>
  <button id="btn-toggle-editor" class="tool-btn" data-i18n="toolbar.editor" data-i18n-title="toolbar.editorTitle"></button>
  <div id="slides-wrap">
    <button id="btn-slides" class="tool-btn" data-i18n="toolbar.slides" data-i18n-title="toolbar.slidesTitle"></button>
    <button id="btn-slides-more" class="tool-btn caret" data-i18n-title="toolbar.slidesMore">▾</button>
    <div id="slides-menu" hidden>
      <button class="menu-item" data-act="preview" type="button" data-i18n="menu.preview"></button>
      <button class="menu-item" data-act="export" type="button" data-i18n="menu.export"></button>
    </div>
  </div>
  <button id="btn-find" class="icon-btn" data-i18n-title="toolbar.find">🔍</button>
  <!-- One settings menu for everything configurable; anything added later belongs in here
       rather than as another toolbar button. Each row opens a submenu to its left — the
       button sits at the right edge, so opening leftwards is what keeps a submenu on
       screen. Theme and language keep their original menu ids, which is what lets their
       render functions (and the tests) stay untouched. -->
  <div id="settings-wrap">
    <button id="btn-settings" class="icon-btn" data-i18n-title="toolbar.settings">⚙</button>
    <div id="settings-menu" hidden>
      <div class="menu-group">
        <button class="menu-row" type="button" data-sub="lang">
          <span class="name" data-i18n="settings.lang"></span>
          <span class="value" id="val-lang"></span>
          <span class="arrow">▸</span>
        </button>
        <div id="lang-menu" class="submenu" hidden></div>
      </div>
      <div class="menu-group">
        <button class="menu-row" type="button" data-sub="theme">
          <span class="name" data-i18n="settings.theme"></span>
          <span class="value" id="val-theme"></span>
          <span class="arrow">▸</span>
        </button>
        <div id="theme-menu" class="submenu" hidden></div>
      </div>
      <div class="menu-sep"></div>
      <div class="menu-group">
        <button class="menu-row" type="button" data-sub="assoc">
          <span class="name" data-i18n="settings.assoc"></span>
          <span class="value" id="val-assoc"></span>
          <span class="arrow">▸</span>
        </button>
        <!-- Filled in by renderAssocMenu(); the state comes from the native side. -->
        <div id="assoc-menu" class="submenu" hidden></div>
      </div>
    </div>
  </div>
</div>

<div id="panes">
  <!-- One find bar for the whole window, acting on the active tab — the way a browser does
       it. Preview matches are drawn with the CSS Custom Highlight API, so nothing in the
       rendered DOM is touched; source matches are painted on the editor's mirror layer. -->
  <div id="findbar" hidden>
    <div class="find-row">
      <input id="find-input" type="text" spellcheck="false" data-i18n-placeholder="find.placeholder">
      <span id="find-count"></span>
      <button id="find-prev" class="icon-btn" type="button" data-i18n-title="find.prev">∧</button>
      <button id="find-next" class="icon-btn" type="button" data-i18n-title="find.next">∨</button>
      <button id="find-close" class="icon-btn" type="button" data-i18n-title="find.close">✕</button>
    </div>
    <div class="find-row">
      <div id="find-scope">
        <button class="seg" type="button" data-scope="source" data-i18n="find.source"></button>
        <button class="seg" type="button" data-scope="preview" data-i18n="find.preview"></button>
      </div>
      <button id="find-case" class="tool-btn" type="button" data-i18n-title="find.case">Aa</button>
    </div>
    <div class="find-row" id="find-replace-row" hidden>
      <input id="replace-input" type="text" spellcheck="false" data-i18n-placeholder="find.replacePlaceholder">
      <button id="replace-one" class="tool-btn" type="button" data-i18n="find.replaceOne"></button>
      <button id="replace-all" class="tool-btn" type="button" data-i18n="find.replaceAll"></button>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="st-name">—</span>
  <span class="spacer"></span>
  <span id="st-info"></span>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt" multiple hidden>

<div id="ext-dialog" hidden>
  <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="ext-title">
    <div class="dialog-title" id="ext-title" data-i18n="dialog.title"></div>
    <div class="dialog-body" id="ext-body"></div>
    <div class="dialog-warn" id="ext-warn" data-i18n="dialog.warn" hidden></div>
    <div class="dialog-actions">
      <button id="ext-keep" class="tool-btn" data-i18n="dialog.keep"></button>
      <button id="ext-reload" class="tool-btn primary" data-i18n="dialog.reload"></button>
    </div>
  </div>
</div>

<template id="pane-tpl">
  <div class="pane">
    <div class="editor-wrap">
      <!-- Mirror layer: the same text with the same metrics, sitting under a transparent
           textarea, so search hits can be painted. A textarea cannot be highlighted any
           other way — its text is not in the DOM, and Chromium does not even draw its own
           selection once it loses focus. -->
      <div class="editor-marks" aria-hidden="true"></div>
      <textarea class="editor" spellcheck="false" data-i18n-placeholder="editor.placeholder"></textarea>
    </div>
    <div class="divider" data-i18n-title="divider.title"></div>
    <button class="editor-toggle" type="button"></button>
    <div class="preview-wrap">
      <article class="preview markdown-body"></article>
    </div>
    <div class="dropzone">
      <div class="dropzone-inner">
        <div class="dz-icon">⬇</div>
        <div class="dz-title" data-i18n="dropzone.title"></div>
        <div class="dz-sub"><span data-i18n="dropzone.subPre"></span><button class="dz-open" data-i18n="dropzone.button"></button><span data-i18n="dropzone.subPost"></span></div>
      </div>
    </div>
  </div>
</template>

<template id="slides-pane-tpl">
  <div class="pane pane-slides">
    <iframe class="slides-frame" data-i18n-title="toolbar.slides"></iframe>
  </div>
</template>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
